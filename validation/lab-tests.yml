# Results of the controlled trigger tests in the real lab (docs/testing-guide.md).
# Fill one in after each test, then run `detlab coverage` to update the matrix.
#
#   status:   not run | passed | failed | not testable
#   date:     YYYY-MM-DD
#   evidence: path to the REDACTED screenshot under evidence/
#   notes:    anything surprising (delay before the alert, extra events, tuning needed)

aws_root_console_login:
  status: passed
  date: 2026-11-27
  evidence: evidence/aws_root_console_login.png
  notes: >-
    Wrong-password root sign-in to the Dev account: "Authentication failed", then a CAPTCHA
    on the next try. Centralised root access is on, so member accounts have no root password
    and the failed sign-in was not logged at all (no ConsoleLogin). "Forgot password" said
    recovery is disabled, but CloudTrail logged PasswordRecoveryRequested (type Root,
    us-east-1, 11:06:18 UTC). The rule was widened to catch that (tuning log), re-imported,
    and the High alert fired on its own at 11:31:53 UTC with the 60-minute look-back, no
    manual run.

aws_cloudtrail_logging_tampering:
  status: passed
  date: 2026-11-26
  evidence: evidence/aws_cloudtrail_logging_tampering.png
  notes: >-
    Two denied StopLogging calls on the organisation trail from the Dev account at 10:28:52
    and 10:29:02 UTC, as a ReadOnly Identity Center user (a low-privilege insider, not an
    admin). Both AccessDenied; the trail kept logging (last file 11:14 UTC, see
    aws_cloudtrail_logging_tampering-trail-still-logging.png). Logs reached S3 by about
    10:30 UTC, were pulled with a read-only SSO role and ingested about 15 minutes later,
    which was past the rule's 10-minute look-back, so the 2 Critical alerts came from a
    Kibana manual run over 10:20-10:40 UTC. Before the test, real Dev logs showed one false
    positive (CloudTrail's own org trail replication), tuned out first (design-notes.md).

aws_console_login_without_mfa:
  status: passed
  date: 2026-11-27
  evidence: evidence/aws_console_login_without_mfa.png
  notes: >-
    Nobody can create IAM users in Dev (the Developer set denies iam:CreateUser and
    iam:CreateLoginProfile), so the admin user was given the Admin permission set on Dev
    for the test only. It created detlab-test-user with a console password, no MFA and no
    permissions, which signed in at 12:02:52 UTC. High alert at 12:12:08 UTC, on its own.
    The admin session's console browsing (336 events ingested) raised no other alerts.
    Clean-up the same evening: user deleted, Admin removed again
    (aws_console_login_without_mfa-cleanup.png).

aws_iam_access_key_created:
  status: passed
  date: 2026-11-27
  evidence: evidence/aws_iam_access_key_created.png
  notes: >-
    A developer (Developer permission set in the Dev account) ran
    `aws iam create-access-key --user-name detlab-test-user` at 11:46:51 UTC. The Developer
    set explicitly denies iam:CreateAccessKey (Project 8 guardrail), so it failed with
    AccessDenied, but CloudTrail logged CreateAccessKey (us-east-1, 11:47:02 UTC). The
    rule alerts on the attempt as well as on success: Medium alert at 12:01:52 UTC, on its
    own. Prevented and detected. Nothing was created, so no clean-up.

aws_guardrail_policy_change:
  status: passed
  date: 2026-11-27
  evidence: evidence/aws_guardrail_policy_change.png
  notes: >-
    Tested with real changes instead of a dummy SCP: the temporary Admin permission set
    given to the admin user on Dev for the no-MFA test (CreateAccountAssignment, 11:55:52
    UTC) and its removal (DeleteAccountAssignment, 12:13:23 UTC), from the management
    account's CloudTrail. Two Medium alerts at 12:32 UTC, on their own. The same logs also
    held the earlier creation of the log-reader permission set (CreatePermissionSet,
    PutInlinePolicyToPermissionSet, CreateAccountAssignment on 2026-11-26), which
    check-export matched too (5 matches, all real admin changes).

aws_activity_outside_approved_region:
  status: passed
  date: 2026-11-27
  evidence: evidence/aws_activity_outside_approved_region.png
  notes: >-
    A developer ran `aws sns create-topic --region us-east-1` at 12:18:26 UTC. The
    Developer set only allows build services in ap-southeast-2, so it failed
    (AuthorizationError, implicit deny), and CloudTrail logged CreateTopic in us-east-1.
    Medium alert at 12:32:04 UTC, on its own. Before the test, the management account's
    real logs showed two false positives (root console sign-ins logged in us-east-2 and
    us-west-2 by regional sign-in endpoints), tuned out first (design-notes.md).

entra_break_glass_signin:
  status: passed
  date: 2026-11-28
  evidence: evidence/entra_break_glass_signin.png
  notes: >-
    One wrong-password sign-in to a break-glass account (bg-emergency prefix) at 09:54
    UTC, then the portal JSON export was ingested. High alert at 10:07:56 UTC, on its own.
    Real finding: the same export showed two earlier successful non-interactive sign-ins
    by that account (Office and Bing apps on a personal phone, with MFA) on 2026-11-27. The
    account had been left signed in on an everyday device after its passkey was set up.
    Same day: confirmed as the owner's own device, all sessions revoked in Entra, the apps
    signed out, and logged as INC-003 in Project 8's incident log. Exactly the "every use
    must be explained" case this rule exists for.

entra_privileged_role_assigned:
  status: passed
  date: 2026-11-28
  evidence: evidence/entra_privileged_role_assigned.png
  notes: >-
    Created a blocked test user, assigned it Privileged Role Administrator (Entra Free, no
    PIM, so a direct active assignment), removed it two minutes later, then deleted the
    user. The audit export had two "Add member to role" events (09:27 and 09:29 UTC) with
    the role name in modifiedProperties, which ingest flattens to
    detlab.modified.Role_DisplayName. Two High alerts at 10:07:56 UTC, on their own.

entra_mass_user_disable:
  status: passed
  date: 2026-11-28
  evidence: evidence/entra_mass_user_disable.png
  notes: >-
    The admin disabled five test users (Edit properties > Settings > Account enabled)
    inside the 09:50 UTC bucket. Five "Disable account" audit events, one actor. Ingested
    about 10:01 UTC; a manual run over 09:15-10:00 UTC raised the High alert. The burst
    was at the end of the bucket, so the next scheduled run (10:08, 10-minute look-back)
    raised it a second time: the aggregating-rule duplicate described in design-notes.md,
    seen in practice. Test users deleted afterwards.

entra_repeated_failed_signins:
  status: passed
  date: 2026-11-28
  evidence: evidence/entra_repeated_failed_signins.png
  notes: >-
    12 to 15 wrong passwords per test user inside one 10-minute bucket each (six test users
    in the end), from a private browser window. Errors 50126 and, once Smart Lockout
    locked the account, 50053. Manual run over the export's time range: six Medium alerts,
    one per user. Test users deleted afterwards.
