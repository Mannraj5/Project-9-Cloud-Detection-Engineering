title: Entra ID User Account Disabled
id: 342b8a64-5d79-4825-98e1-52701d7da1ad
name: entra_user_account_disabled
status: experimental
description: |
  Base rule for the mass-disable correlation below. A single disable is normal admin work,
  so this rule is not deployed on its own.
references:
  - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
author: Manraj Singh Makin
license: MIT
date: 2026-11-24
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    activityDisplayName: Disable account
    result: success
  condition: selection
falsepositives:
  - Normal offboarding.
level: informational
---
title: Entra ID Mass User Disable
id: 650f3112-81e6-4441-8142-33ad0fd01872
name: entra_mass_user_disable
status: experimental
description: |
  Detects one actor disabling five or more user accounts within ten minutes. Attackers (and
  insiders) disable accounts to lock defenders out or to cause disruption.
  The ES|QL backend counts in fixed ten-minute buckets, not a sliding window, so a burst
  that straddles a bucket boundary can be split and missed. See docs/design-notes.md.
references:
  - https://attack.mitre.org/techniques/T1531/
author: Manraj Singh Makin
license: MIT
date: 2026-11-24
tags:
  - attack.impact
  - attack.t1531
correlation:
  type: event_count
  rules:
    - entra_user_account_disabled
  group-by:
    - initiatedBy.user.userPrincipalName
  timespan: 10m
  condition:
    gte: 5
falsepositives:
  - Bulk offboarding at the end of a trimester or contract. Should match an HR or change
    request.
level: high
