title: Entra ID Break-glass Account Sign-in
id: 22d81349-d7fd-445d-b0e4-f61061d40d7a
name: entra_break_glass_signin
status: experimental
description: |
  Detects any sign-in attempt (successful or failed) by an emergency access (break-glass)
  account. These accounts are excluded from Conditional Access by design, so every use must
  be checked.
  The rule matches on a naming prefix. Replace "breakglass" with your own convention. Keep
  the real account names out of this public repo if you can; a prefix is enough.
  Matching uses detlab.user_principal_name_lc, a lower-cased copy of the UPN added at ingest,
  because ES|QL string comparisons are case-sensitive.
references:
  - https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/security-emergency-access
  - https://attack.mitre.org/techniques/T1078/004/
author: Manraj Singh Makin
license: MIT
date: 2026-11-24
tags:
  - attack.initial-access
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1078.004
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    detlab.user_principal_name_lc|startswith: breakglass
  condition: selection
falsepositives:
  - The scheduled break-glass sign-in test (for example quarterly). Record it in the
    break-glass log so the alert can be matched and closed.
level: high
