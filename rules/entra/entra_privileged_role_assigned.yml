title: Entra ID Tier-0 Directory Role Assigned
id: dbf4ff9c-6971-4311-8d08-85481316c2fe
name: entra_privileged_role_assigned
status: experimental
description: |
  Detects a user being added to one of the most powerful Entra ID roles: Global
  Administrator, Privileged Role Administrator or Privileged Authentication Administrator.
  An attacker with any of these can take over the whole tenant.
  The role name sits in targetResources[].modifiedProperties[] as a JSON-quoted string.
  ES|QL cannot match inside multi-valued fields, so the ingest step flattens those
  properties into detlab.modified.<PropertyName> with dots replaced by underscores and the
  quotes removed (Role.DisplayName becomes detlab.modified.Role_DisplayName).
references:
  - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
  - https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/privileged-roles-permissions
  - https://attack.mitre.org/techniques/T1098/003/
author: Manraj Singh Makin
license: MIT
date: 2026-11-24
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.003
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    activityDisplayName: Add member to role
    result: success
    detlab.modified.Role_DisplayName:
      - Global Administrator
      - Privileged Role Administrator
      - Privileged Authentication Administrator
  condition: selection
falsepositives:
  - Planned admin onboarding. In this lab the Project 8 design allows only two break-glass
    accounts and one named admin as permanent Global Administrators, so anything else
    needs a change record.
level: high
