title: AWS CloudTrail Logging Stopped, Deleted or Modified
id: 62747182-c2b6-44b0-aecd-7d617919d393
name: aws_cloudtrail_logging_tampering
status: experimental
description: |
  Detects calls that stop, delete or change a CloudTrail trail or event data store.
  Attackers do this to blind the defender before doing anything else. The rule alerts on
  the attempt, not only on success: a denied StopLogging against the organisation trail is
  still a strong signal that someone tried.
references:
  - https://docs.aws.amazon.com/awscloudtrail/latest/APIReference/API_Operations.html
  - https://attack.mitre.org/techniques/T1685/002/
author: Manraj Singh Makin
license: MIT
date: 2026-11-24
tags:
  - attack.defense-impairment
  - attack.t1685.002
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: cloudtrail.amazonaws.com
    eventName:
      - StopLogging
      - DeleteTrail
      - UpdateTrail
      - PutEventSelectors
      - DeleteEventDataStore
      - StopEventDataStoreIngestion
  condition: selection
falsepositives:
  - An administrator changing trail settings during planned work (for example adding data
    events). Check for a change record before closing as benign.
level: critical
