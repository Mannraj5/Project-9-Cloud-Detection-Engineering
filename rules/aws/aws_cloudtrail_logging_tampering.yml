title: AWS CloudTrail Logging Stopped, Deleted or Modified
id: 62747182-c2b6-44b0-aecd-7d617919d393
name: aws_cloudtrail_logging_tampering
status: experimental
description: |
  Detects calls that stop, delete or change a CloudTrail trail or event data store.
  Attackers do this to blind the defender before doing anything else. The rule alerts on
  the attempt, not only on success: a denied StopLogging against the organisation trail is
  still a strong signal that someone tried.
references:
  - https://docs.aws.amazon.com/awscloudtrail/latest/APIReference/API_Operations.html
  - https://attack.mitre.org/techniques/T1685/002/
author: Manraj Singh Makin
license: MIT
date: 2026-11-24
tags:
  - attack.defense-impairment
  - attack.t1685.002
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: cloudtrail.amazonaws.com
    eventName:
      - StopLogging
      - DeleteTrail
      - UpdateTrail
      - PutEventSelectors
      - DeleteEventDataStore
      - StopEventDataStoreIngestion
  # Creating an organisation trail makes CloudTrail itself copy the trail settings into every
  # member account (PutEventSelectors by its service-linked role). Seen in the real Dev logs
  # on 2026-11-21. Only AWS can use that role, so it is excluded, but only when both markers
  # are present: in ES|QL a "not" on a missing field drops the event, so the guards keep
  # anything without them (a person, a cross-account call) alerting.
  filter_cloudtrail_service_role:
    userIdentity.invokedBy: cloudtrail.amazonaws.com
    userIdentity.sessionContext.sessionIssuer.userName: AWSServiceRoleForCloudTrail
  guard_no_invoked_by:
    userIdentity.invokedBy: null
  guard_no_session_issuer:
    userIdentity.sessionContext.sessionIssuer.userName: null
  condition: selection and (1 of guard_* or not filter_cloudtrail_service_role)
falsepositives:
  - An administrator changing trail settings during planned work (for example adding data
    events). Check for a change record before closing as benign.
  - CloudTrail replicating an organisation trail into member accounts is already excluded
    (see filter_cloudtrail_service_role).
level: critical
