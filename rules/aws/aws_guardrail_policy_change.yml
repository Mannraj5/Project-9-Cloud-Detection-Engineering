title: AWS SCP or Identity Center Permission Set Changed
id: 2ac02bf7-474e-4a8a-b656-6840b5307ac6
name: aws_guardrail_policy_change
status: experimental
description: |
  Detects changes to the two main access guardrails in the lab: Organizations service
  control policies (SCPs) and IAM Identity Center permission sets or account assignments.
  Loosening either one can quietly give someone more access across every account.
references:
  - https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
  - https://docs.aws.amazon.com/singlesignon/latest/userguide/logging-using-cloudtrail.html
  - https://attack.mitre.org/techniques/T1484/
  - https://attack.mitre.org/techniques/T1098/003/
author: Manraj Singh Makin
license: MIT
date: 2026-11-24
tags:
  - attack.defense-impairment
  - attack.privilege-escalation
  - attack.persistence
  - attack.t1484
  - attack.t1098.003
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_scp:
    eventSource: organizations.amazonaws.com
    eventName:
      - CreatePolicy
      - UpdatePolicy
      - DeletePolicy
      - AttachPolicy
      - DetachPolicy
      - EnablePolicyType
      - DisablePolicyType
  selection_permission_set:
    eventSource: sso.amazonaws.com
    eventName:
      - CreatePermissionSet
      - UpdatePermissionSet
      - DeletePermissionSet
      - PutInlinePolicyToPermissionSet
      - DeleteInlinePolicyFromPermissionSet
      - AttachManagedPolicyToPermissionSet
      - DetachManagedPolicyFromPermissionSet
      - AttachCustomerManagedPolicyReferenceToPermissionSet
      - DetachCustomerManagedPolicyReferenceFromPermissionSet
      - PutPermissionsBoundaryToPermissionSet
      - DeletePermissionsBoundaryFromPermissionSet
      - ProvisionPermissionSet
      - CreateAccountAssignment
      - DeleteAccountAssignment
  condition: 1 of selection_*
falsepositives:
  - Planned guardrail changes by the lab administrator. Match against the Project 8 change
    log before closing.
level: medium
