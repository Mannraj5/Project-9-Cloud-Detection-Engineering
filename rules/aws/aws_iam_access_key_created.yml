title: AWS IAM Access Key Created
id: 8d8f4de8-e5c0-476e-a86a-b80a8a810d40
name: aws_iam_access_key_created
status: experimental
description: |
  Detects creation of a long-lived IAM access key. The lab policy is "no long-lived keys":
  people use Identity Center and automation uses roles or OIDC, so any new key is either a
  policy breach or an attacker adding a persistent credential.
references:
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateAccessKey.html
  - https://attack.mitre.org/techniques/T1098/001/
author: Manraj Singh Makin
license: MIT
date: 2026-11-24
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.001
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName: CreateAccessKey
  condition: selection
falsepositives:
  - A third-party tool that only supports access keys, created under an approved exception.
level: medium
