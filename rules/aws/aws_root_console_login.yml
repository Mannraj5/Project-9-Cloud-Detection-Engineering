title: AWS Root User Console Sign-in
id: 714a85b6-9110-4c7a-8f9a-4e047d8f48ae
name: aws_root_console_login
status: experimental
description: |
  Detects a console sign-in attempt (successful or failed) by the AWS account root user.
  In this lab every human signs in through IAM Identity Center, so the root user should
  only ever be used for the few tasks that need it, under a documented break-glass procedure.
references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-tasks.html
  - https://attack.mitre.org/techniques/T1078/004/
author: Manraj Singh Makin
license: MIT
date: 2026-11-24
tags:
  - attack.initial-access
  - attack.persistence
  - attack.privilege-escalation
  - attack.stealth
  - attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: signin.amazonaws.com
    eventName: ConsoleLogin
    userIdentity.type: Root
  condition: selection
falsepositives:
  - Planned root tasks (closing an account, changing the support plan, restoring a lost
    management account admin). These should match a change ticket or break-glass log entry.
level: high
