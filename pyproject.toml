[project]
name = "detlab"
version = "0.1.0"
description = "Sigma detections for AWS CloudTrail and Entra ID, mapped to MITRE ATT&CK, tested offline and in Elasticsearch."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Manraj Singh Makin" }]
requires-python = ">=3.10"
# Pinned: the offline evaluator walks pySigma's parsed rule objects, so a pySigma upgrade
# should be a deliberate change that re-runs the live Elasticsearch tests.
dependencies = [
    "pySigma==1.5.1",
    "pySigma-backend-elasticsearch==2.1.1",
    "PyYAML>=6.0",
]
keywords = ["sigma", "detection-engineering", "siem", "elasticsearch", "cloudtrail", "entra-id", "mitre-attack"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "sigma-cli==3.1.0"]

[project.scripts]
detlab = "detlab.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
