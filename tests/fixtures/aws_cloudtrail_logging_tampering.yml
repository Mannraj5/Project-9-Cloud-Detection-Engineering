rule: aws_cloudtrail_logging_tampering
cases:
  - name: denied StopLogging on the organisation trail from the Dev account (the safe lab test)
    expect: alert
    events:
      - eventVersion: "1.10"
        userIdentity:
          type: AssumedRole
          arn: "arn:aws:sts::111111111111:assumed-role/AWSReservedSSO_DevAdmin_0123456789abcdef/student"
          accountId: "111111111111"
        eventTime: "2026-12-05T10:00:00Z"
        eventSource: cloudtrail.amazonaws.com
        eventName: StopLogging
        awsRegion: ap-southeast-2
        sourceIPAddress: 203.0.113.10
        errorCode: AccessDenied
        errorMessage: "User is not authorized to perform: cloudtrail:StopLogging"
        requestParameters: {name: "arn:aws:cloudtrail:ap-southeast-2:222222222222:trail/org-trail"}
        responseElements: null
        eventID: 0a6f3c1e-0002-4000-8000-000000000001
        readOnly: false
        eventType: AwsApiCall
        recipientAccountId: "111111111111"

  - name: trail deleted
    expect: alert
    events:
      - eventVersion: "1.10"
        userIdentity: {type: AssumedRole, arn: "arn:aws:sts::111111111111:assumed-role/AWSReservedSSO_DevAdmin_0123456789abcdef/student", accountId: "111111111111"}
        eventTime: "2026-12-05T10:05:00Z"
        eventSource: cloudtrail.amazonaws.com
        eventName: DeleteTrail
        awsRegion: ap-southeast-2
        sourceIPAddress: 203.0.113.10
        requestParameters: {name: detlab-test-trail}
        responseElements: null
        eventID: 0a6f3c1e-0002-4000-8000-000000000002
        readOnly: false
        eventType: AwsApiCall
        recipientAccountId: "111111111111"

  - name: reading trail status is fine
    expect: no_alert
    events:
      - eventVersion: "1.10"
        userIdentity: {type: AssumedRole, arn: "arn:aws:sts::111111111111:assumed-role/AWSReservedSSO_DevReadOnly_0123456789abcdef/student", accountId: "111111111111"}
        eventTime: "2026-12-05T10:10:00Z"
        eventSource: cloudtrail.amazonaws.com
        eventName: GetTrailStatus
        awsRegion: ap-southeast-2
        sourceIPAddress: 203.0.113.10
        requestParameters: {name: org-trail}
        eventID: 0a6f3c1e-0002-4000-8000-000000000003
        readOnly: true
        eventType: AwsApiCall
        recipientAccountId: "111111111111"

  - name: StopLogging name used by a different service does not match
    expect: no_alert
    events:
      - eventVersion: "1.10"
        userIdentity: {type: AssumedRole, accountId: "111111111111"}
        eventTime: "2026-12-05T10:12:00Z"
        eventSource: example-other.amazonaws.com
        eventName: StopLogging
        awsRegion: ap-southeast-2
        eventID: 0a6f3c1e-0002-4000-8000-000000000004
        readOnly: false
        eventType: AwsApiCall
        recipientAccountId: "111111111111"

  # Tuning cases (2026-11-26). The first one is the real false positive from the Dev
  # account's logs, anonymised: creating the organisation trail made CloudTrail replicate
  # its event selectors into the member account with its own service-linked role.
  - name: CloudTrail replicating the organisation trail into a member account is not an attack
    expect: no_alert
    events:
      - eventVersion: "1.11"
        userIdentity:
          type: AssumedRole
          arn: "arn:aws:sts::111111111111:assumed-role/AWSServiceRoleForCloudTrail/CloudTrailOrganizationReplication"
          accountId: "111111111111"
          sessionContext:
            sessionIssuer:
              type: Role
              arn: "arn:aws:iam::111111111111:role/aws-service-role/cloudtrail.amazonaws.com/AWSServiceRoleForCloudTrail"
              accountId: "111111111111"
              userName: AWSServiceRoleForCloudTrail
            attributes: {creationDate: "2026-11-21T07:17:33Z", mfaAuthenticated: "false"}
          invokedBy: cloudtrail.amazonaws.com
        eventTime: "2026-11-21T07:17:33Z"
        eventSource: cloudtrail.amazonaws.com
        eventName: PutEventSelectors
        awsRegion: ap-southeast-2
        sourceIPAddress: cloudtrail.amazonaws.com
        userAgent: cloudtrail.amazonaws.com
        requestParameters:
          trailName: "arn:aws:cloudtrail:ap-southeast-2:222222222222:trail/org-trail"
          advancedEventSelectors:
            - name: Management events selector
              fieldSelectors: [{field: eventCategory, equals: [Management]}]
        eventID: 0a6f3c1e-0002-4000-8000-000000000005
        readOnly: false
        eventType: AwsApiCall
        managementEvent: true
        recipientAccountId: "111111111111"
        eventCategory: Management

  - name: an admin changing event selectors by hand still alerts (no invokedBy)
    expect: alert
    events:
      - eventVersion: "1.11"
        userIdentity:
          type: AssumedRole
          arn: "arn:aws:sts::111111111111:assumed-role/AWSReservedSSO_DevAdmin_0123456789abcdef/student"
          accountId: "111111111111"
          sessionContext:
            sessionIssuer:
              type: Role
              arn: "arn:aws:iam::111111111111:role/aws-reserved/sso.amazonaws.com/ap-southeast-2/AWSReservedSSO_DevAdmin_0123456789abcdef"
              accountId: "111111111111"
              userName: AWSReservedSSO_DevAdmin_0123456789abcdef
        eventTime: "2026-12-05T10:20:00Z"
        eventSource: cloudtrail.amazonaws.com
        eventName: PutEventSelectors
        awsRegion: ap-southeast-2
        sourceIPAddress: 203.0.113.10
        requestParameters: {trailName: detlab-test-trail}
        eventID: 0a6f3c1e-0002-4000-8000-000000000006
        readOnly: false
        eventType: AwsApiCall
        recipientAccountId: "111111111111"

  - name: invoked by CloudTrail but through a different role still alerts (the exclusion is narrow)
    expect: alert
    events:
      - eventVersion: "1.11"
        userIdentity:
          type: AssumedRole
          arn: "arn:aws:sts::111111111111:assumed-role/SomeOtherRole/session"
          accountId: "111111111111"
          sessionContext:
            sessionIssuer: {type: Role, accountId: "111111111111", userName: SomeOtherRole}
          invokedBy: cloudtrail.amazonaws.com
        eventTime: "2026-12-05T10:25:00Z"
        eventSource: cloudtrail.amazonaws.com
        eventName: UpdateTrail
        awsRegion: ap-southeast-2
        sourceIPAddress: cloudtrail.amazonaws.com
        eventID: 0a6f3c1e-0002-4000-8000-000000000007
        readOnly: false
        eventType: AwsApiCall
        recipientAccountId: "111111111111"

  - name: cross-account StopLogging with no ARN or session context still alerts (null guard)
    expect: alert
    events:
      - eventVersion: "1.11"
        userIdentity: {type: AWSAccount, principalId: "AIDAEXAMPLE", accountId: "222222222222"}
        eventTime: "2026-12-05T10:30:00Z"
        eventSource: cloudtrail.amazonaws.com
        eventName: StopLogging
        awsRegion: ap-southeast-2
        sourceIPAddress: 198.51.100.20
        errorCode: AccessDenied
        requestParameters: {name: "arn:aws:cloudtrail:ap-southeast-2:222222222222:trail/org-trail"}
        eventID: 0a6f3c1e-0002-4000-8000-000000000008
        readOnly: false
        eventType: AwsApiCall
        recipientAccountId: "111111111111"
