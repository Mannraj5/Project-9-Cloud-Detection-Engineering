rule: entra_break_glass_signin
cases:
  - name: break-glass account signs in (UPN in mixed case)
    expect: alert
    events:
      - id: 6b1f0000-0007-4000-8000-000000000001
        createdDateTime: "2026-12-10T22:00:00Z"
        userDisplayName: Break Glass 01
        userPrincipalName: BreakGlass01@lab.example
        userId: 00000000-0000-4000-8000-0000000000b1
        appDisplayName: Microsoft Entra admin center
        ipAddress: 203.0.113.10
        clientAppUsed: Browser
        conditionalAccessStatus: notApplied
        isInteractive: true
        status: {errorCode: 0, failureReason: null, additionalDetails: null}
        location: {city: Sydney, state: New South Wales, countryOrRegion: AU}

  - name: failed sign-in to a break-glass account also alerts
    expect: alert
    events:
      - id: 6b1f0000-0007-4000-8000-000000000002
        createdDateTime: "2026-12-10T22:05:00Z"
        userPrincipalName: breakglass02@lab.example
        appDisplayName: Microsoft Azure Portal
        ipAddress: 198.51.100.66
        status: {errorCode: 50126, failureReason: Invalid username or password or Invalid on-premise username or password.}
        location: {countryOrRegion: NL}

  - name: normal user sign-in
    expect: no_alert
    events:
      - id: 6b1f0000-0007-4000-8000-000000000003
        createdDateTime: "2026-12-10T22:10:00Z"
        userPrincipalName: student@lab.example
        appDisplayName: Microsoft Azure Portal
        ipAddress: 203.0.113.10
        status: {errorCode: 0}

  - name: "known gap: name contains the word but does not start with it"
    expect: no_alert
    events:
      - id: 6b1f0000-0007-4000-8000-000000000004
        createdDateTime: "2026-12-10T22:15:00Z"
        userPrincipalName: admin.breakglass@lab.example
        appDisplayName: Microsoft Azure Portal
        status: {errorCode: 0}
