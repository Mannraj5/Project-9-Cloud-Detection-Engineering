name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: offline tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Sigma syntax and ATT&CK tags
        run: sigma check --fail-on-error --fail-on-issues rules

      - name: Unit and fixture tests
        run: python -m pytest -v

      - name: Repository lint (metadata, mappings, redaction, generated files)
        run: detlab lint

  live-elastic:
    name: fixtures against real Elasticsearch
    runs-on: ubuntu-latest
    needs: offline
    services:
      elasticsearch:
        image: elasticsearch:8.19.7
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e .

      - name: Run every fixture case with the generated ES|QL
        env:
          ES_URL: http://localhost:9200
        run: detlab live-validate

      - name: Build Elastic Security rule import file
        run: detlab kibana -o build/kibana-rules.ndjson

      - uses: actions/upload-artifact@v7
        with:
          name: kibana-rules
          path: build/kibana-rules.ndjson
